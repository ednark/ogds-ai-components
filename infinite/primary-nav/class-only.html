/* ogds-primary-nav — derived light-DOM CSS from @ogds/elements@1.0.0-beta.2 (tools/build-ground-truth.mjs). */
/* ogds tokens subset (generated by tools/build-ground-truth.mjs) */
:root, :host {
  --ogds-spacing-1: 0.5rem;
  --ogds-spacing-105: 0.75rem;
  --ogds-spacing-2: 1rem;
  --ogds-spacing-4: 2rem;

  --ogds-theme-type-scale-md: 1.0625rem;

/* --- ogds-primary-nav.css (from @ogds/elements@1.0.0-beta.2) --- */
@layer ogds.components;

@layer ogds.components {
  .ogds-primary-nav,
  ogds-primary-nav {
    --ogds-primary-nav-current-indicator-color: var(
      --ogds-theme-color-primary,
      #005ea2
    );
    --ogds-primary-nav-focus-outline-color: var(
      --ogds-theme-focus-color,
      #2491ff
    );
    --ogds-primary-nav-font-family: system-ui, sans-serif;
    --ogds-primary-nav-font-size: var(--ogds-theme-type-scale-md, 1.0625rem);
    --ogds-primary-nav-icon-size: 1.25rem;
    --ogds-primary-nav-link-color: var(--ogds-theme-text-color, #1b1b1b);
    --ogds-primary-nav-link-hover-background-color: var(
      --ogds-theme-color-base-lightest,
      #f0f0f0
    );
    --ogds-primary-nav-link-hover-color: var(
      --ogds-theme-color-primary,
      #005ea2
    );
    --ogds-primary-nav-submenu-background-color: var(
      --ogds-theme-color-primary-darker,
      #162e51
    );
    --ogds-primary-nav-submenu-divider-color: var(
      --ogds-theme-color-base-lighter,
      #dfe1e2
    );
    --ogds-primary-nav-submenu-link-color: var(
      --ogds-theme-text-reverse-color,
      #fff
    );

    box-sizing: border-box;
    display: block;
    font-family: var(--ogds-primary-nav-font-family);
    font-size: var(--ogds-primary-nav-font-size);

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    > ul {
      display: flex;
      flex-direction: column;
    }

    li {
      padding: var(--ogds-spacing-105, 0.75rem) var(--ogds-spacing-2, 1rem);
      position: relative;
    }

    > ul > li:first-child a,
    > ul > li:first-child > details > summary {
      padding-inline-start: 0;
    }

    a,
    summary {
      align-items: center;
      color: var(--ogds-primary-nav-link-color);
      cursor: pointer;
      display: flex;
      font-weight: 700;
      gap: 0.5rem;
      justify-content: space-between;
      text-decoration: none;

      &:focus-visible {
        outline: 0.25rem solid var(--ogds-primary-nav-focus-outline-color);
      }
    }

    > ul > li > a:hover,
    > ul > li > a[aria-current="page"],
    > ul > li > details:not([open]) > summary:hover,
    > ul > li > details > summary[aria-current="page"] {
      position: relative;

      &::before {
        background-color: var(--ogds-primary-nav-current-indicator-color);
        bottom: -0.5rem;
        content: "";
        height: 0.25rem;
        inset-inline: 0;
        position: absolute;
      }
    }

    summary {
      list-style: none;

      &::-webkit-details-marker {
        display: none;
      }

      &::after {
        background-color: currentColor;
        content: "";
        flex-shrink: 0;
        height: var(--ogds-primary-nav-icon-size);
        mask-image: var(--ogds-primary-nav-icon-chevron-down);
        mask-position: center;
        mask-repeat: no-repeat;
        mask-size: contain;
        width: var(--ogds-primary-nav-icon-size);
      }
    }

    details[open] > summary::after {
      mask-image: var(--ogds-primary-nav-icon-chevron-up);
    }

    details > ul {
      background-color: transparent;
      padding-block: var(--ogds-spacing-1, 0.5rem);
    }

    details > ul > li {
      border-block-start: 1px solid
        var(--ogds-primary-nav-submenu-divider-color);
    }

    details > ul a {
      color: var(--ogds-primary-nav-link-color);
      font-weight: 400;
      padding-inline-start: var(--ogds-spacing-4, 2rem);

      &:hover {
        text-decoration: underline;
      }

      &:focus-visible {
        outline-offset: -0.25rem;
      }
    }

    details > ul > li:has(> a:hover) {
      background-color: var(--ogds-primary-nav-link-hover-background-color);
    }

    /**
     * The breakpoint below is not exposed as a custom property because CSS
     * media queries cannot read custom property values. Keep it in sync with
     * --ogds-breakpoint-desktop from @ogds/tokens.
     */
    @media (width >= 64rem) {
      > ul {
        align-items: stretch;
        flex-direction: row;
      }

      li {
        padding-block: var(--ogds-spacing-1, 0.5rem);
      }

      > ul > li {
        display: flex;

        > a:hover,
        > details:not([open]) > summary:hover {
          background-color: transparent;
          color: var(--ogds-primary-nav-link-hover-color);
        }

        &:has(> details[open]) {
          background-color: var(--ogds-primary-nav-submenu-background-color);
        }
      }

      details[open] > summary {
        color: var(--ogds-primary-nav-submenu-link-color);
      }

      details > ul {
        background-color: var(--ogds-primary-nav-submenu-background-color);
        inline-size: 15rem;
        inset-inline-start: 0;
        position: absolute;
        top: 100%;

        > li {
          border-block-start: none;

          &:has(> a:hover) {
            background-color: transparent;
          }
        }

        a {
          color: var(--ogds-primary-nav-submenu-link-color);
          padding-inline-start: 0;
        }
      }
    }
  }
}

/* keeping this rule outside of the layer because layered CSS loses
 * to unlayered in a specificity fight, so this was clobbered by the

}

ogds-primary-nav, .ogds-primary-nav {
  --ogds-primary-nav-icon-chevron-down: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M16.59%208.59%2012%2013.17%207.41%208.59%206%2010l6%206%206-6z%22%2F%3E%3C%2Fsvg%3E");
  --ogds-primary-nav-icon-chevron-up: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22m12%208-6%206%201.41%201.41L12%2010.83l4.59%204.58L18%2014z%22%2F%3E%3C%2Fsvg%3E");
}

<body>
<div class="ogds-primary-nav" role="navigation" aria-label="Primary navigation">
  <ul>
  <li><a href="#" aria-current="page">Current section</a></li>
  <li>
    <details>
      <summary>Benefits</summary>
      <ul>
        <li><a href="#">Apply for benefits</a></li>
        <li><a href="#">Check application status</a></li>
        <li><a href="#">Manage your account</a></li>
      </ul>
    </details>
  </li>
  <li>
    <details>
      <summary>Resources</summary>
      <ul>
        <li><a href="#">Guides</a></li>
        <li><a href="#">FAQ</a></li>
      </ul>
    </details>
  </li>
  <li><a href="#">About</a></li>
  <li><a href="#">Contact</a></li>
</ul>
</div>
<script>
(function () {
  var nav = document.querySelector('.ogds-primary-nav');
  if (!nav) return;
  var submenus = Array.prototype.slice.call(nav.querySelectorAll(':scope > ul > li > details'));
  var instanceName = 'ogds-primary-nav-1';
  submenus.forEach(function (d) {
    if (!d.hasAttribute('name')) d.setAttribute('name', instanceName);
  });
  document.addEventListener('click', function (event) {
    submenus.forEach(function (details) {
      if (details.open && event.target && !details.contains(event.target)) {
        details.open = false;
      }
    });
  });
  nav.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    var openSubmenus = submenus.filter(function (d) { return d.open; });
    if (!openSubmenus.length) return;
    var active = document.activeElement;
    var target = openSubmenus.find(function (d) { return d.contains(active); }) || openSubmenus[0];
    target.open = false;
    var summary = target.querySelector(':scope > summary');
    if (summary) summary.focus();
  });
})();
</script>
</body>
