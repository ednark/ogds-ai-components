/* ogds-header + ogds-primary-nav — derived light-DOM CSS from @ogds/elements@1.0.0-beta.2 (tools/build-ground-truth.mjs). */
/* ogds tokens subset (generated by tools/build-ground-truth.mjs) */
:root, :host {
  --ogds-color-white: #fff;
  --ogds-size-touch-target: 3rem;
  --ogds-spacing-05: 0.25rem;
  --ogds-spacing-1: 0.5rem;
  --ogds-spacing-2: 1rem;
  --ogds-spacing-3: 1.5rem;
  --ogds-theme-type-scale-2xs: 0.875rem;
}

/* --- ogds-header.css (from @ogds/elements@1.0.0-beta.2) --- */
.ogds-header {
  --ogds-header-divider-color: var(--ogds-color-base-lighter, #dfe1e2);
  --ogds-header-drawer-width: min(90vw, 21rem);
  --ogds-header-font-family: system-ui, sans-serif;
  --ogds-header-icon-close-size: 1.5rem;
  --ogds-header-icon-menu-size: 1.25rem;
  --ogds-header-menu-btn-background-color: var(
    --ogds-theme-color-primary,
    #005ea2
  );
  --ogds-header-menu-btn-background-color-hover: var(
    --ogds-theme-color-primary-dark,
    #1a4480
  );
  --ogds-header-menu-btn-color: var(--ogds-color-white, #fff);
  --ogds-header-nav-background-color: var(--ogds-color-white, #fff);
  --ogds-header-overlay-color: rgb(0 0 0 / 70%);
  --ogds-header-row-gap: var(--ogds-spacing-2, 1rem);

  /*
   * Workaround needed for --_ogds-header-gutter below. eslint/css can't
   * parse a `var()` with a fallback in a `min()`. Same bug as the one
   * causing the FIXME re: the accordion css in the eslint config
   */
  --_ogds-header-max-width-or-100pct: var(--ogds-header-max-width, 100%);

  /*
   * Private (not a documented @cssprop 🤫): the distance
   * from this row's own edge to where a centered column of
   * --ogds-header-max-width would sit. Workaround for rows that
   * share physical space with a sibling (.navbar-row-inner and
   * .nav-secondary, when they're on the same row. See the
   * @media (width >= 64rem) block below). A row that gets the whole width
   * to itself just uses max-width + margin: auto + padding-inline
   * directly (see e.g. .info-row-inner, .primary-row-inner).
   */
  --_ogds-header-gutter: max(
    var(--ogds-header-padding-inline, 0),
    calc((100% - min(100%, var(--_ogds-header-max-width-or-100pct))) / 2)
  );

  display: block;
  font-family: var(--ogds-header-font-family);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

.content {
  display: flex;
  flex-direction: column;
  row-gap: var(--ogds-header-row-gap);
}

.navbar-row {
  background-color: var(--ogds-header-navbar-background-color, transparent);
  display: flex;
}

.navbar-row-inner {
  align-items: center;
  box-sizing: content-box;
  display: flex;
  gap: var(--ogds-spacing-2, 1rem);
  justify-content: space-between;
  margin-inline: auto;
  max-width: var(--ogds-header-max-width, none);
  padding-block: var(--ogds-spacing-3, 1.5rem);
  padding-inline: var(--ogds-header-padding-inline, 0);
  width: 100%;
}

.info-row {
  background-color: var(--ogds-header-info-background-color, transparent);
  border-block: 1px solid var(--ogds-header-divider-color);
}

.info-row-inner {
  box-sizing: content-box;
  font-size: var(--ogds-theme-type-scale-2xs, 0.875rem);
  margin-inline: auto;
  max-width: var(--ogds-header-max-width, none);
  padding-block: var(--ogds-spacing-05, 0.25rem);
  padding-inline: var(--ogds-header-padding-inline, 0);
  width: 100%;
}

.nav-secondary {
  display: flex;
  flex: 0 0 auto;
  gap: var(--ogds-spacing-1, 0.5rem);
}

/*
 * Primary nav row (desktop only - the equivalent structure below the
 * desktop breakpoint lives inside <dialog>, see .nav-primary-row further
 * down). Same "no align-items" reasoning as .navbar-row above.
 */
.primary-row {
  background-color: var(
    --ogds-header-nav-primary-row-background-color,
    transparent
  );
  border-block-start: 1px solid
    var(
      --ogds-header-nav-primary-row-divider-color,
      var(--ogds-header-divider-color)
    );
  display: flex;
}

.primary-row-inner {
  align-items: center;
  box-sizing: content-box;
  display: flex;
  gap: var(--ogds-spacing-2, 1rem);
  justify-content: space-between;
  margin-inline: auto;
  max-width: var(--ogds-header-max-width, none);
  padding-inline: var(--ogds-header-padding-inline, 0);
  width: 100%;
}

.notifications {
  align-items: center;
  display: flex;
  margin-inline-start: auto;
}

.menu-btn {
  align-items: center;
  background-color: var(--ogds-header-menu-btn-background-color);
  border: none;
  color: var(--ogds-header-menu-btn-color);
  cursor: pointer;
  display: none;
  flex: none;
  font: inherit;
  font-weight: 700;
  gap: var(--ogds-spacing-1, 0.5rem);
  height: var(--ogds-size-touch-target, 2.5rem);
  padding-inline: var(--ogds-spacing-2, 1rem);

  &:hover {
    background-color: var(--ogds-header-menu-btn-background-color-hover);
  }

  &.with-icon::before {
    background-color: currentColor;
    content: "";
    display: inline-block;
    height: var(--ogds-header-icon-menu-size);
    mask-image: var(--ogds-header-icon-menu);
    mask-position: center;
    mask-repeat: no-repeat;
    mask-size: contain;
    width: var(--ogds-header-icon-menu-size);
  }
}

.nav-close {
  align-self: flex-end;
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  flex: none;
  height: var(--ogds-size-touch-target, 2.5rem);
  width: var(--ogds-size-touch-target, 2.5rem);

  &::before {
    background-color: currentColor;
    content: "";
    display: block;
    height: var(--ogds-header-icon-close-size);
    margin-inline: auto;
    mask-image: var(--ogds-header-icon-close);
    mask-position: center;
    mask-repeat: no-repeat;
    mask-size: contain;
    width: var(--ogds-header-icon-close-size);
  }
}

/*
 * <dialog> only ever exists in the DOM below the desktop breakpoint (see
 * render() in ogds-header.ts) so the styles don't need to account for it
 * at desktop width
 */
.nav {
  background-color: var(--ogds-header-nav-background-color);
  border: none;
  color: inherit;
  height: 100%;
  inset-block: 0;
  inset-inline: auto 0;
  margin: 0;
  max-height: none;
  max-width: none;
  padding: var(--ogds-spacing-2, 1rem);
  position: fixed;
  translate: 100% 0;
  width: var(--ogds-header-drawer-width);

  &.no-transition {
    transition: none;
  }

  &::backdrop {
    background: var(--ogds-header-overlay-color);
  }

  &[open] {
    display: flex;
    flex-direction: column;
    translate: 0 0;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .nav {
    transition:
      translate 0.3s ease-in-out,
      display 0.3s ease-in-out allow-discrete,
      overlay 0.3s ease-in-out allow-discrete;
  }

  @starting-style {
    .nav[open] {
      translate: 100% 0;
    }
  }
}

.nav-primary {
  display: block;
}

.nav > .nav-secondary {
  background-color: var(
    --ogds-header-nav-secondary-background-color,
    transparent
  );
  flex-direction: column;
}

.nav-primary-row {
  border-block-start: 1px solid
    var(
      --ogds-header-nav-primary-row-divider-color,
      var(--ogds-header-divider-color)
    );
  margin-block-start: var(--ogds-spacing-2, 1rem);
  padding-block-start: var(--ogds-spacing-2, 1rem);
}

@media (width < 64rem) {
  .menu-btn {
    display: inline-flex;
  }

  .navbar-row-inner {
    padding-inline-end: var(
      --ogds-header-menu-btn-padding-inline-end,
      var(--ogds-header-padding-inline, 0)
    );
  }

  .nav-close {
    display: block;
  }
}

@media (width >= 64rem) {
  .navbar-row:has(> .nav-secondary) .navbar-row-inner {
    flex: 1 1 auto;
    margin-inline: 0;
    max-width: none;
    padding-inline: 0;
    padding-inline-start: var(--_ogds-header-gutter);
    width: auto;
  }

  .navbar-row > .nav-secondary {
    align-items: flex-end;
    align-self: stretch;
    background-color: var(
      --ogds-header-nav-secondary-background-color,
      var(--ogds-header-navbar-background-color, transparent)
    );
    flex-direction: column;
    justify-content: center;
    padding-inline-end: var(--_ogds-header-gutter);
  }

  .primary-row > .nav-secondary {
    align-items: center;
    align-self: stretch;
    background-color: var(
      --ogds-header-nav-secondary-background-color,
      var(--ogds-header-nav-primary-row-background-color, transparent)
    );
    padding-inline-start: var(--_ogds-header-gutter);
  }

  .primary-row:has(> .nav-secondary) .primary-row-inner {
    flex: 1 1 auto;
    margin-inline: 0;
    max-width: none;
    padding-inline: 0;
    padding-inline-end: var(--_ogds-header-gutter);
    width: auto;
  }
}

[hidden] {
  display: none;
}

  --ogds-header-icon-menu: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M3%2018h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z%22%2F%3E%3C%2Fsvg%3E");
}

/* ogds tokens subset (generated by tools/build-ground-truth.mjs) */
:root, :host {
  --ogds-spacing-1: 0.5rem;
  --ogds-spacing-105: 0.75rem;
  --ogds-spacing-2: 1rem;
  --ogds-spacing-4: 2rem;
  --ogds-theme-text-color: #1b1b1b;
  --ogds-theme-type-scale-md: 1.0625rem;
}

/* --- ogds-primary-nav.css (from @ogds/elements@1.0.0-beta.2) --- */
@layer ogds.components;

@layer ogds.components {
  .ogds-primary-nav,
  ogds-primary-nav {
    --ogds-primary-nav-current-indicator-color: var(
      --ogds-theme-color-primary,
      #005ea2
    );
    --ogds-primary-nav-focus-outline-color: var(
      --ogds-theme-focus-color,
      #2491ff
    );
    --ogds-primary-nav-font-family: system-ui, sans-serif;
    --ogds-primary-nav-font-size: var(--ogds-theme-type-scale-md, 1.0625rem);
    --ogds-primary-nav-icon-size: 1.25rem;
    --ogds-primary-nav-link-color: var(--ogds-theme-text-color, #1b1b1b);
    --ogds-primary-nav-link-hover-background-color: var(
      --ogds-theme-color-base-lightest,
      #f0f0f0
    );
    --ogds-primary-nav-link-hover-color: var(
      --ogds-theme-color-primary,
      #005ea2
    );
    --ogds-primary-nav-submenu-background-color: var(
      --ogds-theme-color-primary-darker,
      #162e51
    );
    --ogds-primary-nav-submenu-divider-color: var(
      --ogds-theme-color-base-lighter,
      #dfe1e2
    );
    --ogds-primary-nav-submenu-link-color: var(
      --ogds-theme-text-reverse-color,
      #fff
    );

    box-sizing: border-box;
    display: block;
    font-family: var(--ogds-primary-nav-font-family);
    font-size: var(--ogds-primary-nav-font-size);

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    > ul {
      display: flex;
      flex-direction: column;
    }

    li {
      padding: var(--ogds-spacing-105, 0.75rem) var(--ogds-spacing-2, 1rem);
      position: relative;
    }

    > ul > li:first-child a,
    > ul > li:first-child > details > summary {
      padding-inline-start: 0;
    }

    a,
    summary {
      align-items: center;
      color: var(--ogds-primary-nav-link-color);
      cursor: pointer;
      display: flex;
      font-weight: 700;
      gap: 0.5rem;
      justify-content: space-between;
      text-decoration: none;

      &:focus-visible {
        outline: 0.25rem solid var(--ogds-primary-nav-focus-outline-color);
      }
    }

    > ul > li > a:hover,
    > ul > li > a[aria-current="page"],
    > ul > li > details:not([open]) > summary:hover,
    > ul > li > details > summary[aria-current="page"] {
      position: relative;

      &::before {
        background-color: var(--ogds-primary-nav-current-indicator-color);
        bottom: -0.5rem;
        content: "";
        height: 0.25rem;
        inset-inline: 0;
        position: absolute;
      }
    }

    summary {
      list-style: none;

      &::-webkit-details-marker {
        display: none;
      }

      &::after {
        background-color: currentColor;
        content: "";
        flex-shrink: 0;
        height: var(--ogds-primary-nav-icon-size);
        mask-image: var(--ogds-primary-nav-icon-chevron-down);
        mask-position: center;
        mask-repeat: no-repeat;
        mask-size: contain;
        width: var(--ogds-primary-nav-icon-size);
      }
    }

    details[open] > summary::after {
      mask-image: var(--ogds-primary-nav-icon-chevron-up);
    }

    details > ul {
      background-color: transparent;
      padding-block: var(--ogds-spacing-1, 0.5rem);
    }

    details > ul > li {
      border-block-start: 1px solid
        var(--ogds-primary-nav-submenu-divider-color);
    }

    details > ul a {
      color: var(--ogds-primary-nav-link-color);
      font-weight: 400;
      padding-inline-start: var(--ogds-spacing-4, 2rem);

      &:hover {
        text-decoration: underline;
      }

      &:focus-visible {
        outline-offset: -0.25rem;
      }
    }

    details > ul > li:has(> a:hover) {
      background-color: var(--ogds-primary-nav-link-hover-background-color);
    }

    /**
     * The breakpoint below is not exposed as a custom property because CSS
     * media queries cannot read custom property values. Keep it in sync with
     * --ogds-breakpoint-desktop from @ogds/tokens.
     */
    @media (width >= 64rem) {
      > ul {
        align-items: stretch;
        flex-direction: row;
      }

      li {
        padding-block: var(--ogds-spacing-1, 0.5rem);
      }

      > ul > li {
        display: flex;

        > a:hover,
        > details:not([open]) > summary:hover {
          background-color: transparent;
          color: var(--ogds-primary-nav-link-hover-color);
        }

        &:has(> details[open]) {
          background-color: var(--ogds-primary-nav-submenu-background-color);
        }
      }

      details[open] > summary {
        color: var(--ogds-primary-nav-submenu-link-color);
      }

      details > ul {
        background-color: var(--ogds-primary-nav-submenu-background-color);
        inline-size: 15rem;
        inset-inline-start: 0;
        position: absolute;
        top: 100%;

        > li {
          border-block-start: none;

          &:has(> a:hover) {
            background-color: transparent;
          }
        }

        a {
          color: var(--ogds-primary-nav-submenu-link-color);
          padding-inline-start: 0;
        }
      }
    }
  }
}
